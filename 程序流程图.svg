<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1360" width="100%" height="100%" font-family="SimSun, 宋体, serif">
<rect width="1120" height="1360" fill="#FFFFFF"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
<rect x="480" y="20" width="160" height="56" rx="28" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="54" text-anchor="middle" font-size="17" font-weight="bold" fill="#000">开始</text>
<rect x="390" y="100" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="134" text-anchor="middle" font-size="16" fill="#000">选择科室 / 医生 / 就诊日期</text>
<rect x="390" y="180" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="214" text-anchor="middle" font-size="16" fill="#000">查询排班余号</text>
<polygon points="560,260 680,310 560,360 440,310" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="316" text-anchor="middle" font-size="16" fill="#000">余号 &gt; 0 ？</text>
<rect x="390" y="384" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="418" text-anchor="middle" font-size="16" fill="#000">生成挂号记录（余号 − 1）</text>
<rect x="390" y="464" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="498" text-anchor="middle" font-size="16" fill="#000">医生接诊</text>
<rect x="390" y="544" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="578" text-anchor="middle" font-size="15" fill="#000">书写病历（可调用 AI 草稿与质控）</text>
<rect x="390" y="624" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="658" text-anchor="middle" font-size="16" fill="#000">开具处方（选择药品）</text>
<polygon points="560,704 680,754 560,804 440,754" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="760" text-anchor="middle" font-size="16" fill="#000">存在配伍禁忌 ？</text>
<rect x="390" y="828" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="862" text-anchor="middle" font-size="16" fill="#000">保存处方（扣减药品库存）</text>
<rect x="390" y="908" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="942" text-anchor="middle" font-size="16" fill="#000">药房发药</text>
<polygon points="560,988 680,1038 560,1088 440,1038" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="1044" text-anchor="middle" font-size="16" fill="#000">是否退药 ？</text>
<rect x="390" y="1112" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="1146" text-anchor="middle" font-size="16" fill="#000">生成费用记录</text>
<rect x="390" y="1192" width="340" height="56" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="1226" text-anchor="middle" font-size="16" fill="#000">费用结算</text>
<rect x="480" y="1272" width="160" height="56" rx="28" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="560" y="1306" text-anchor="middle" font-size="17" font-weight="bold" fill="#000">结束</text>
<rect x="60" y="278" width="220" height="64" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="170" y="316" text-anchor="middle" font-size="15" fill="#000">提示号源不足</text>
<rect x="800" y="722" width="220" height="64" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="910" y="760" text-anchor="middle" font-size="14" fill="#000">拦截提示，不写入数据</text>
<rect x="800" y="1006" width="220" height="64" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="910" y="1044" text-anchor="middle" font-size="15" fill="#000">回滚药品库存</text>
